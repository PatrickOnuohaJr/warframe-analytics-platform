name: Frontend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warframe-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: warframe-client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run lint -- --max-warnings=0
      - run: npm run build
